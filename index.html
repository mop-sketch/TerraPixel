<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarcadia</title>
    <script>
      // The game was called TerraPixel. A player's settings and progress were saved under that name;
      // carry them over to the new one, once, before anything reads them.
      try {
        for (let k = 0; k < localStorage.length; k++) {
          const key = localStorage.key(k);
          if (!key || !key.startsWith('terrapixel.')) continue;
          const moved = 'jarcadia.' + key.slice('terrapixel.'.length);
          if (localStorage.getItem(moved) === null) localStorage.setItem(moved, localStorage.getItem(key));
        }
      } catch {
        // Storage disabled: nothing saved to carry over.
      }
    </script>
    <script type="module" crossorigin src="/TerraPixel/assets/index-DaAnY_iG.js"></script>
    <link rel="stylesheet" crossorigin href="/TerraPixel/assets/index-4SPMbUNO.css">
  </head>
  <body>
    <!--
      The notebook spread. The canvas lives here in the markup, not inside a Panel template: main.ts
      and the Renderer take hold of #stage before Panel is built, so a Panel that set innerHTML on any
      ancestor of the canvas would silently destroy the element they are drawing into.
    -->
    <div id="app">
      <header id="topbar"></header>
      <main id="jar"><div id="stage-wrap"><canvas id="stage" width="792" height="408"></canvas></div></main>
      <section id="tray" aria-label="Tools"></section>
      <aside id="notes" aria-label="Field notes"></aside>
    </div>
  </body>
</html>
